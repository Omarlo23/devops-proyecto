
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: staging

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: devops-app
        version: v1

    spec:
      # Security Context a nivel Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: app
          image: nginx:1.25-alpine

          ports:
            - containerPort: 80

          # Security Context a nivel Container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          envFrom:
            - configMapRef:
                name: devops-app-config
            - secretRef:
                name: devops-app-secret

          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
