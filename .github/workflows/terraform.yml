name: Terraform IaC

on:
  push:
    branches: [master]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

  pull_request:
    branches: [master]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Plan y Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Configurar credenciales Azure para Terraform
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -e

          echo "$AZURE_CREDENTIALS" | jq -e '
            (.clientId | strings | length > 0) and
            (.clientSecret | strings | length > 0) and
            (.subscriptionId | strings | length > 0) and
            (.tenantId | strings | length > 0)
          ' > /dev/null

          echo "ARM_CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientId')" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientSecret')" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.subscriptionId')" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.tenantId')" >> "$GITHUB_ENV"

          echo "Credenciales Azure configuradas para Terraform"

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verificar sesión Azure
        run: az account show --query "{subscription:id, tenant:tenantId}" -o table

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply (solo en master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan