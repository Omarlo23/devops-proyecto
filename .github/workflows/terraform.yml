```yaml
name: Terraform IaC

on:
  push:
    branches: [master]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

  pull_request:
    branches: [master]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Plan y Apply
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      # Variable de entrada para Terraform
      TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Validar credenciales Azure
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "ERROR: AZURE_CREDENTIALS está vacío"
            exit 1
          fi

          echo "$AZURE_CREDENTIALS" | jq -e '
            (.clientId | strings | length > 0) and
            (.clientSecret | strings | length > 0) and
            (.subscriptionId | strings | length > 0) and
            (.tenantId | strings | length > 0)
          ' > /dev/null

          echo "Credenciales Azure correctamente estructuradas"

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verificar sesión Azure
        run: az account show --query "{subscription:id, tenant:tenantId}" -o table

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply (solo en master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan
```