- name: Terraform Init
  working-directory: terraform
  run: terraform init
  env:
    ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}

- name: Terraform Validate
  working-directory: terraform
  run: terraform validate
  env:
    ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}

- name: Terraform Plan
  working-directory: terraform
  run: terraform plan
  env:
    ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}