
name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [master]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cd-aks-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy → Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout código de CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Verificar configuración
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          echo "Ambiente: ${{ vars.APP_ENV }}"

          if [ -n "$DB_URL" ]; then
            echo "DB configurada: SI"
          else
            echo "DB configurada: NO"
          fi

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Conectar a AKS
        run: |
          az aks get-credentials \
            --resource-group rg-devops-academia \
            --name aks-devops \
            --overwrite-existing

          kubectl cluster-info
          kubectl get nodes

      - name: Helm deploy en Staging
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/devops-app
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          helm upgrade --install devops-app helm/devops-app \
            --namespace staging \
            --create-namespace \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m

      - name: Verificar Deployment en Staging
        run: |
          echo "=== DEPLOYMENT STAGING ==="

          kubectl rollout status deployment/devops-app \
            -n staging \
            --timeout=120s

          echo "=== PODS STAGING ==="

          kubectl get pods -n staging -o wide

          echo "=== REPLICAS STAGING ==="

          kubectl get deployment devops-app -n staging

  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    if: ${{ needs.deploy-staging.result == 'success' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout código de CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Conectar a AKS
        run: |
          az aks get-credentials \
            --resource-group rg-devops-academia \
            --name aks-devops \
            --overwrite-existing

          kubectl cluster-info
          kubectl get nodes

      - name: Helm deploy en Production
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/devops-app
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          helm upgrade --install devops-app helm/devops-app \
            --namespace production \
            --create-namespace \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m

      - name: Verificar Deployment en Production
        run: |
          echo "=== DEPLOYMENT PRODUCTION ==="

          kubectl rollout status deployment/devops-app \
            -n production \
            --timeout=120s

          echo "=== PODS PRODUCTION ==="

          kubectl get pods -n production -o wide

          echo "=== REPLICAS PRODUCTION ==="

          kubectl get deployment devops-app -n production
