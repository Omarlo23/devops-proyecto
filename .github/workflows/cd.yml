name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [master]
    types: [completed]

jobs:
  deploy-staging:
    name: Deploy → Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuración del ambiente
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          echo "Ambiente: ${{ vars.APP_ENV }}"
          if [ -n "$DB_URL" ]; then
            echo "DB configurada: SI"
          else
            echo "DB configurada: NO"
          fi

      - name: Simular deploy en Staging
        run: |
          echo "========================================="
          echo "  DEPLOY A STAGING"
          echo "  Versión: ${{ github.event.workflow_run.head_sha }}"
          echo "  Ambiente: ${{ vars.APP_ENV }}"
          echo "  Réplicas: ${{ vars.REPLICA_COUNT }}"
          echo "========================================="
          echo "Deploy completado exitosamente en staging"

  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuración del ambiente
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          echo "Ambiente: ${{ vars.APP_ENV }}"
          if [ -n "$DB_URL" ]; then
            echo "DB configurada: SI"
          else
            echo "DB configurada: NO"
          fi

      - name: Simular deploy en Producción
        run: |
          echo "========================================="
          echo "  DEPLOY A PRODUCCIÓN"
          echo "  Versión: ${{ github.event.workflow_run.head_sha }}"
          echo "  Ambiente: ${{ vars.APP_ENV }}"
          echo "  Réplicas: ${{ vars.REPLICA_COUNT }}"
          echo "========================================="
          echo "Deploy completado exitosamente en producción"