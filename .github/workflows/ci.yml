
name: CI Python

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linting
        run: flake8 . --max-line-length=100

      - name: Crear directorio de resultados
        if: always()
        run: mkdir -p test-results

      - name: Tests con coverage
        run: |
          pytest tests/ -v --tb=short \
            --junitxml=test-results/results.xml \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Build imagen Docker
        run: docker build -t devops-app:${{ github.sha }} .

      - name: Escaneo de seguridad con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Publicar imagen (solo en push a main)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag devops-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}